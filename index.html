<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Morning Routine</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: absolute; left: 0; top: 0;
           -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
           -webkit-user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
// Load the game scripts in dependency order with a cache-busting query, so
// the browser never runs a stale copy after an update (simple static
// servers don't send cache headers). document.write keeps the order.
(function () {
  var files = [
    'src/config.js',
    'src/palette.js',
    'src/weather.js',
    'src/font.js',
    'src/sprites.js',
    'src/character.js',
    'src/sky.js',
    'src/scenes/shower.js',
    'src/scenes/dressing.js',
    'src/scenes/breakfast.js',
    'src/ui.js',
    'src/states.js',
    'src/testmode.js',
    'src/main.js'
  ], v = new Date().getTime(), i;
  for (i = 0; i < files.length; i++) {
    document.write('<script src="' + files[i] + '?v=' + v + '"><\/script>');
  }
}());
</script>
</body>
</html>
