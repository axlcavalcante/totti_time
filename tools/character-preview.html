<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Character Preview</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ccc; font: 12px monospace; }
  canvas { display: block; }
</style>
</head>
<body>
<p>Dev only. Every part, overlay, outfit and idle frame at 4x. Warnings go to the console (MR.config.DEV is on).</p>
<canvas id="c"></canvas>
<script src="../src/config.js"></script>
<script>MR.config.DEV = true;</script>
<script src="../src/palette.js"></script>
<script src="../src/font.js"></script>
<script src="../src/sprites.js"></script>
<script src="../src/character.js"></script>
<script>
(function () {
  var S = 4, ch = MR.character, canvas = document.getElementById('c'), ctx, x, y, rowH, k, v, item, slot;
  var items = [];   // { label, canvas, groundX?, groundY? }

  MR.font.init();

  function add(label, c, ax, ay) { items.push({ label: label, canvas: c, ax: ax, ay: ay }); }

  // Poses per outfit and color set
  var outfits = ['underwear', 'dressed', 'ready'];
  var arms = ['down', 'waveMid', 'waveUp'];
  outfits.forEach(function (o) {
    arms.forEach(function (a) {
      var b = ch.bake({ outfit: o, armR: a });
      add(o + ' / ' + a, b.canvas, b.ax, b.ay);
    });
  });
  var blue = ch.bake({ outfit: 'ready', colors: 'blue' });
  add('ready / colors:blue', blue.canvas, blue.ax, blue.ay);
  var blink = ch.bake({ outfit: 'ready', eyes: 'closed', offsets: { torso: [0, 1] } });
  add('blink + breath', blink.canvas, blink.ax, blink.ay);
  [['scrubA', 'scrubB', 'closed', 'smile'], ['scrubB', 'scrubA', 'closed', 'smile'],
   ['down', 'down', 'happy', 'open']].forEach(function (a) {
    var b = ch.bake({ outfit: 'bath', torso: 'bath', legs: 'hidden', feet: null, hair: 'wet',
      armL: a[0], armR: a[1], eyes: a[2], mouth: a[3], order: ch.ORDER_ARMS_FRONT });
    add('bath / ' + a.join(' '), b.canvas, b.ax, b.ay);
  });
  [
    ['towel (bare chest)', { torso: 'bare', clothes: ['towelWrap'], armL: 'holdLow', armR: 'holdLow' }],
    ['bare + shirt', { torso: 'bare', clothes: ['pants', 'tshirt'] }],
    ['bare + rolled', { torso: 'bare', clothes: ['pants', 'tshirtRolled'], armL: 'waveUp', armR: 'waveUp' }],
    ['pants half (stand)', { clothes: ['pantsHalf'] }],
    ['pants half (hop)', { clothes: ['pantsHalf'], legs: 'hop', feet: 'hop', armL: 'holdLow', armR: 'holdLow' }],
    ['pants (hop)', { clothes: ['pants'], legs: 'hop', feet: 'hop' }],
    ['sit + pants', { clothes: ['pants'], legs: 'sit' }],
    ['shirt rolled', { clothes: ['pants', 'tshirtRolled'], legs: 'sit', armL: 'waveUp', armR: 'waveUp' }],
    ['shirt on', { clothes: ['pants', 'tshirt'], legs: 'sit', armL: 'holdLow', armR: 'holdLow' }],
    ['lift L', { clothes: ['pants', 'tshirt'], legs: 'sitLiftL', feet: 'liftL', armL: 'reachDown', armR: 'reachDown' }],
    ['sock L + lift R', { clothes: ['pants', 'tshirt', 'sockLeft'], legs: 'sitLiftR', feet: 'liftR', armL: 'reachDown', armR: 'reachDown' }],
    ['socks, sit', { clothes: ['pants', 'tshirt', 'socks'], legs: 'sit' }],
    ['breakfast spoonMid', { outfit: 'dressed', legs: 'hidden', feet: null, armR: 'spoonMid' }],
    ['breakfast toMouth R', { outfit: 'dressed', legs: 'hidden', feet: null, armR: 'toMouth', mouth: 'open' }],
    ['breakfast chew puff', { outfit: 'dressed', legs: 'hidden', feet: null, head: 'puff', mouth: 'chewA' }],
    ['breakfast sip L', { outfit: 'dressed', legs: 'hidden', feet: null, armL: 'toMouth', eyes: 'closed' }],
    ['breakfast milky', { outfit: 'dressed', legs: 'hidden', feet: null, mouth: 'milky', eyes: 'happy' }]
  ].forEach(function (a) {
    var pose = { outfit: 'underwear' }, k2;
    for (k2 in a[1]) { pose[k2] = a[1][k2]; }
    var b = ch.bake(pose);
    add('dress / ' + a[0], b.canvas, b.ax, b.ay);
  });
  [['cryA', 'wailA'], ['cryB', 'wailB'], ['worried', 'worried']].forEach(function (a) {
    var b = ch.bake({ outfit: 'ready', eyes: a[0], mouth: a[1] });
    add('ready / ' + a.join(' '), b.canvas, b.ax, b.ay);
  });

  // Raw parts
  var map = MR.palette.merge(MR.palette.CHARACTER_BODY, MR.palette.OUTFIT_COLORS['default']);
  for (k in ch.PARTS) {
    for (v in ch.PARTS[k]) { add('part ' + k + '.' + v, MR.sprites.buildSprite(ch.PARTS[k][v].data, map)); }
  }
  for (item in ch.CLOTHES) {
    for (slot in ch.CLOTHES[item]) {
      for (v in ch.CLOTHES[item][slot]) {
        add(item + ' ' + slot + '.' + v, MR.sprites.buildSprite(ch.CLOTHES[item][slot][v], map));
      }
    }
  }

  // Grid layout
  var W = 1100, pad = 16;
  canvas.width = W;
  x = pad; y = pad; rowH = 0;
  var pos = items.map(function (it) {
    var w = Math.max(it.canvas.width * S, 110), h = it.canvas.height * S + 20;
    if (x + w > W - pad) { x = pad; y += rowH + pad; rowH = 0; }
    var p = { x: x, y: y };
    x += w + pad;
    if (h > rowH) { rowH = h; }
    return p;
  });
  canvas.height = y + rowH + pad;
  ctx = canvas.getContext('2d');
  MR.sprites.setSmoothing(ctx, false);
  ctx.fillStyle = MR.palette.UI.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  items.forEach(function (it, i) {
    var p = pos[i];
    ctx.fillStyle = '#335';
    ctx.fillRect(p.x, p.y + 12, it.canvas.width * S, it.canvas.height * S);
    ctx.drawImage(it.canvas, p.x, p.y + 12, it.canvas.width * S, it.canvas.height * S);
    if (it.ax !== undefined) {   // ground anchor
      ctx.fillStyle = '#0f0';
      ctx.fillRect(p.x + it.ax * S - 1, p.y + 12 + it.ay * S - 1, 3, 3);
    }
    ctx.fillStyle = '#ccc';
    ctx.fillText(it.label + ' ' + it.canvas.width + 'x' + it.canvas.height, p.x, p.y + 8);
  });
}());
</script>
</body>
</html>
